<!DOCTYPE html><meta charset="utf-8"><pre id="o"></pre><iframe id="f" src="../../Assets/hi_tecnologia.html" style="width:360px;height:600px;border:0"></iframe><script>document.getElementById("f").onload=function(){var d=this.contentDocument;var w=d.documentElement.clientWidth,largos=[];d.querySelectorAll("body *").forEach(function(e){var r=e.getBoundingClientRect();if(r.right>w+1&&!e.closest(".tabela"))largos.push(e.tagName+"."+e.className+" "+Math.round(r.right));});document.getElementById("o").textContent="viewport="+w+" scrollWidth="+d.documentElement.scrollWidth+"\n"+largos.slice(0,15).join("\n");};</script>
