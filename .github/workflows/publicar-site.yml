# Publica o site no GitHub Pages deste repositório:
# https://gbroccol0.github.io/ProgramaFormacaoVendas/
#
# Só vai para o endereço do site o que o navegador precisa: index.html e
# Assets/. fontes/, ferramentas/, supabase/, CLAUDE.md e README.md ficam
# visíveis no GitHub (repositório público), mas não são servidos pelo site.
#
# Requer, uma vez: Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "Assets/**"
      - ".github/workflows/publicar-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Separar só o site
        run: |
          mkdir _site
          cp -r index.html Assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
